<svg xmlns="http://www.w3.org/2000/svg" width="800" height="168" viewBox="0 0 800 168" role="img" aria-label="FP無料相談の進み方">
  <rect x="0" y="0" width="800" height="168" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4c7e">FP無料相談の進み方（一般的な流れ）</text>
  <g font-size="13" fill="#333333">
    <rect x="10" y="48" width="180" height="100" rx="8" fill="#eef3f9" stroke="#2b4c7e"/>
    <text x="100" y="74" text-anchor="middle" font-weight="bold" fill="#2b4c7e">1. 数字を整理する</text>
    <text x="100" y="96" text-anchor="middle">収入・支出</text>
    <text x="100" y="114" text-anchor="middle">資産の残高</text>
    <text x="100" y="132" text-anchor="middle">年金の見込み</text>
    <rect x="210" y="48" width="180" height="100" rx="8" fill="#eef3f9" stroke="#2b4c7e"/>
    <text x="300" y="74" text-anchor="middle" font-weight="bold" fill="#2b4c7e">2. 申し込む</text>
    <text x="300" y="96" text-anchor="middle">相談したい</text>
    <text x="300" y="114" text-anchor="middle">テーマを伝える</text>
    <rect x="410" y="48" width="180" height="100" rx="8" fill="#eef3f9" stroke="#2b4c7e"/>
    <text x="500" y="74" text-anchor="middle" font-weight="bold" fill="#2b4c7e">3. FPと面談</text>
    <text x="500" y="96" text-anchor="middle">現状と希望を話す</text>
    <text x="500" y="114" text-anchor="middle">試算の前提を</text>
    <text x="500" y="132" text-anchor="middle">確認する</text>
    <rect x="610" y="48" width="180" height="100" rx="8" fill="#eef3f9" stroke="#2b4c7e"/>
    <text x="700" y="74" text-anchor="middle" font-weight="bold" fill="#2b4c7e">4. 自宅で検討</text>
    <text x="700" y="96" text-anchor="middle">提案は持ち帰り</text>
    <text x="700" y="114" text-anchor="middle">その場で決めない</text>
  </g>
  <g fill="#2b4c7e">
    <path d="M192 92 L206 92 L206 86 L218 98 L206 110 L206 104 L192 104 Z"/>
    <path d="M392 92 L406 92 L406 86 L418 98 L406 110 L406 104 L392 104 Z"/>
    <path d="M592 92 L606 92 L606 86 L618 98 L606 110 L606 104 L592 104 Z"/>
  </g>
</svg>
